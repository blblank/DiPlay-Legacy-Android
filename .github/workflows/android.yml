name: Build DiPlay Release APK

on:
  push:
    tags:
      - 'v*' # 推送 v1.0 之类的 tag 时触发
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 需要写入权限来创建 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools ndk;28.2.13676358'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 Secrets 恢复签名密钥库
      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV

      # 注入签名相关的环境变量，供 Gradle 读取
      - name: Setup Signing Environment
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # 构建 Release APK（带签名）
      - name: Build Release APK
        run: ./gradlew :mobile:assembleRelease --stacktrace

      # 上传 APK 作为构建产物
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-release-apk
          path: mobile/build/outputs/apk/release/*.apk
          retention-days: 30

      # 如果触发了 tag，则创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
